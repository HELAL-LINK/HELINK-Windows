<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELINK</title>
<script>
// Before anything is drawn: light or dark like Windows, and the language chosen.
(function () {
  var env = window.__nzEnv || {};
  var q = new URLSearchParams(location.search);
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  var dark = mq ? mq.matches : false;
  if (q.get('theme')) dark = q.get('theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  if (mq && !q.get('theme') && mq.addEventListener) {
    mq.addEventListener('change', function (e) { document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light'); });
  }
  var lang = env.lang || q.get('lang') || 'ar';
  document.documentElement.lang = lang === 'en' ? 'en' : 'ar';
  document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
})();
</script>
<style>
/*@FONTS@*/
:root {
  /* HELINK: black and the logo's orange */
  --brand: #F27221;
  --brand-hover: #FF8A3D;
  --brand-press: #D9600F;
  --brand-tint: #FDEDE2;
  --brand-line: #F5B58A;
  --accent-text: #B84A06;
  --on-brand: #000000;
  --bg: #F3F3F3;
  --surface: #FFFFFF;
  --surface-2: #F8F8F8;
  --ink: #111111;
  --muted: #5E5E5E;
  --faint: #8C8C8C;
  --line: #E3E3E3;
  --row-hover: #F6F6F6;
  --sel: #FDEDE2;
  --ok: #138A4A;
  --ok-tint: #E3F5EA;
  --bad: #B53A2E;
  --bad-tint: #FBEDEA;
  --wait: #8A6A00;
  --wait-tint: #FFF4D1;
  --focus: #111111;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px -12px rgba(0, 0, 0, .22);
  --shadow-lg: 0 24px 60px -18px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .12);
  --font: "Alexandria", "Segoe UI", Tahoma, sans-serif;
  --cols: minmax(180px, 1fr) 84px 160px 104px 76px 80px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --brand-tint: #3A2416;
  --brand-line: #8A4A22;
  --accent-text: #FF9550;
  --bg: #111111;
  --surface: #1B1B1B;
  --surface-2: #222222;
  --ink: #F2F2F2;
  --muted: #A8A8A8;
  --faint: #7A7A7A;
  --line: #303030;
  --row-hover: #232323;
  --sel: #33241A;
  --ok: #4CC983;
  --ok-tint: #12301F;
  --bad: #F08A7E;
  --bad-tint: #3A1A1D;
  --wait: #F2C14E;
  --wait-tint: #3A3115;
  --focus: #F27221;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px -14px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); font-size: 14px; line-height: 1.55; color: var(--ink); background: var(--bg);
  display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); overflow: hidden;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
body > .bar { grid-row: 1; }
body > .banner { grid-row: 2; }
body > .app { grid-row: 3; }
body > .statusbar { grid-row: 4; }
.grow { flex: 1; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
bdi { unicode-bidi: isolate; }
svg { flex: none; }
[hidden] { display: none !important; }
p { margin: 0; }
h1, h2, h3 { margin: 0; font-weight: 700; }
input[type="text"], input[type="number"], select, textarea {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 11px; outline: none;
  user-select: text; -webkit-user-select: text; min-height: 40px;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--brand); }
textarea { resize: vertical; direction: ltr; text-align: left; font-family: Consolas, ui-monospace, monospace; font-size: 13px; line-height: 1.5; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px;
  border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
.btn.primary:active { background: var(--brand-press); }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { min-height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.linkbtn {
  border: 0; background: none; padding: 4px 4px; margin: -4px 0; color: var(--accent-text); font-weight: 700;
  border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px;
}

/* ---------- header ---------- */
.bar { background: #000; color: #fff; border-bottom: 3px solid var(--brand); display: flex; align-items: center; gap: 6px; padding: 7px 12px; min-height: 56px; min-width: 0; overflow: hidden; }
.bar > * { flex-shrink: 0; }
.brand { display: flex; align-items: center; direction: ltr; margin-inline-end: 8px; }
.logo { display: block; width: 112px; height: 24px; color: #fff; }
.add-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px 0 12px; border: 0; border-radius: 10px;
  background: var(--brand); color: #000; font-weight: 800; white-space: nowrap;
}
html[dir="rtl"] .add-btn { padding: 0 12px 0 14px; }
.add-btn:hover { background: var(--brand-hover); }
.add-btn.alt { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px #4A4A4A; font-weight: 700; }
.add-btn.alt:hover { background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1.5px var(--brand); }
.tools { display: flex; align-items: center; gap: 2px; margin-inline-start: 6px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; border: 0; border-radius: 9px;
  background: transparent; color: #fff; font-weight: 600; font-size: 13px; white-space: nowrap;
}
.tool:hover:not(:disabled) { background: rgba(255, 255, 255, .12); }
.tool:disabled { color: #6E6E6E; cursor: default; }
.tool svg { color: inherit; }
.sep { width: 1px; height: 22px; background: #3A3A3A; margin: 0 4px; }
.spacer { flex: 1; }
.search {
  display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 9px; background: #1E1E1E;
  border: 1.5px solid #333; min-width: 120px; width: 220px; color: #BDBDBD; flex-shrink: 1;
}
.search:focus-within { border-color: var(--brand); }
.search input { all: unset; flex: 1; min-width: 0; width: 0; color: #fff; font-size: 13.5px; user-select: text; -webkit-user-select: text; }
.search input::placeholder { color: #8F8F8F; }
.ibtn { width: 38px; height: 38px; border-radius: 9px; border: 0; background: transparent; color: #fff; display: grid; place-items: center; }
.ibtn:hover { background: rgba(255, 255, 255, .12); }
.lang-btn { height: 34px; min-width: 44px; padding: 0 10px; border-radius: 999px; border: 1.5px solid #4A4A4A; background: transparent; color: #fff; font-weight: 700; font-size: 13px; }
.lang-btn:hover { border-color: #7A7A7A; }
.ext-dot { position: relative; }
.ext-dot.off::after {
  content: ""; position: absolute; top: 7px; inset-inline-end: 7px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand); box-shadow: 0 0 0 2px #000;
}

/* ---------- banner (video tools) ---------- */
.banner { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--brand-tint); border-bottom: 1px solid var(--brand-line); font-size: 13.5px; }
.banner.bad { background: var(--bad-tint); border-color: transparent; }
.banner .txt { flex: 1; min-width: 0; }
.banner .mini { width: 160px; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, .1); overflow: hidden; flex: none; }
:root[data-theme="dark"] .banner .mini { background: rgba(255, 255, 255, .12); }
.banner .mini i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .3s; }

/* ---------- side bar ---------- */
.app { display: grid; grid-template-columns: 206px minmax(0, 1fr); min-height: 0; }
.side { background: var(--surface); border-inline-end: 1px solid var(--line); overflow: auto; padding: 10px 8px 14px; display: flex; flex-direction: column; gap: 2px; }
.side h3 { font-size: 11.5px; color: var(--faint); font-weight: 700; margin: 12px 10px 4px; letter-spacing: .02em; }
.cat {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 0; border-radius: 9px; background: none;
  text-align: start; font-weight: 600; color: var(--muted); min-height: 38px;
}
.cat:hover { background: var(--row-hover); color: var(--ink); }
.cat[aria-current="true"] { background: var(--brand-tint); color: var(--ink); }
.cat[aria-current="true"] .ci { color: var(--accent-text); }
.cat .ci { width: 20px; height: 20px; display: grid; place-items: center; color: var(--faint); flex: none; }
.cat > span:nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat .n { margin-inline-start: auto; font-size: 12px; font-weight: 700; color: var(--faint); min-width: 18px; text-align: center; }
.side-act {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px; min-height: 38px; margin-top: 2px; border: 1.5px dashed var(--brand-line);
  border-radius: 9px; background: none; text-align: start; font-weight: 700; font-size: 13px; color: var(--accent-text);
}
.side-act:hover { background: var(--brand-tint); }
.side-act svg { flex: none; }
.side-card { margin-top: auto; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); display: grid; gap: 8px; }
.side-card b { font-size: 13.5px; }
.side-card p { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

/* ---------- the list ---------- */
.content { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; background: var(--surface); }
.listwrap { overflow: auto; min-height: 0; position: relative; }
.list { min-width: 0; }
.row {
  display: grid; grid-template-columns: var(--cols); align-items: center; gap: 12px; padding: 0 14px; min-height: 52px;
  border-bottom: 1px solid var(--line); position: relative;
}
.head {
  position: sticky; top: 0; z-index: 2; min-height: 36px; background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 12px; font-weight: 700; color: var(--muted);
}
.head button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 2px; }
.head button:focus-visible { outline: 2px solid var(--focus); }
.head button .arrow { opacity: 0; width: 10px; }
.head button[data-dir] .arrow { opacity: 1; }
.head button[data-dir="asc"] .arrow { transform: rotate(180deg); }
.item { cursor: default; }
.item:hover { background: var(--row-hover); }
.item[aria-selected="true"] { background: var(--sel); }
.item[aria-selected="true"]::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--brand); }
.c-name { display: flex; align-items: center; gap: 11px; min-width: 0; }
.ficon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; position: relative; overflow: hidden; }
.ficon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ficon.video { background: #FFE6D6; color: #C2510A; }
.ficon.music { background: #E8E4FF; color: #5B47D6; }
.ficon.pictures { background: #FFE3EE; color: #C2185B; }
.ficon.programs { background: #DFF0FF; color: #1F6FB8; }
.ficon.documents { background: #E3F5EA; color: #138A4A; }
.ficon.compressed { background: #FFF1CC; color: #9A6B00; }
.ficon.other { background: #EDEDED; color: #5E5E5E; }
:root[data-theme="dark"] .ficon.video { background: #3B2416; color: #FF9550; }
:root[data-theme="dark"] .ficon.music { background: #252047; color: #A99BFF; }
:root[data-theme="dark"] .ficon.pictures { background: #3A1626; color: #FF8AB5; }
:root[data-theme="dark"] .ficon.programs { background: #14283C; color: #6CB4F5; }
:root[data-theme="dark"] .ficon.documents { background: #12301F; color: #4CC983; }
:root[data-theme="dark"] .ficon.compressed { background: #352A0E; color: #F2C14E; }
:root[data-theme="dark"] .ficon.other { background: #2A2A2A; color: #B0B0B0; }
.ficon .site { position: absolute; bottom: 0; inset-inline-end: 0; background: rgba(0, 0, 0, .8); color: #fff; font-size: 8.5px; font-weight: 800; padding: 1px 3px; border-start-start-radius: 4px; line-height: 1.2; }
.nm { min-width: 0; display: grid; }
.nm .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; text-align: left; }
html[dir="rtl"] .nm .t, html[dir="rtl"] .nm .s .tx { text-align: right; }
.nm .s { font-size: 12px; color: var(--muted); display: flex; align-items: center; min-width: 0; white-space: nowrap; }
.nm .s .tx { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; text-align: left; }
.nm .s .lab { flex: none; display: inline-block; font-weight: 700; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-inline-end: 6px; font-size: 11px; line-height: 1.5; direction: ltr; }
.nm .s .lab.nomusic { display: inline-flex; align-items: center; gap: 3px; direction: inherit; color: var(--accent-text); background: var(--brand-tint); border-color: var(--brand-line); }
.c-size, .c-speed, .c-eta, .c-date { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-size { color: var(--ink); }
.c-prog { display: grid; gap: 4px; min-width: 0; }
.c-prog .st { font-size: 12px; font-weight: 600; white-space: nowrap; display: flex; gap: 6px; align-items: center; min-width: 0; }
.c-prog .st .stx { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.c-prog .st .pct { flex: none; margin-inline-start: auto; color: var(--muted); font-weight: 600; direction: ltr; }
.bar6 { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
.bar6 i { position: absolute; inset-block: 0; inset-inline-start: 0; width: 0; background: var(--brand); border-radius: 3px; transition: width .4s linear; }
.bar6.busy i { width: 100% !important; background: repeating-linear-gradient(-45deg, var(--brand) 0 8px, var(--brand-hover) 8px 16px); background-size: 23px 23px; animation: stripes .9s linear infinite; }
@keyframes stripes { to { background-position: 23px 0; } }
.s-running .st { color: var(--ink); }
.s-queued .st { color: var(--muted); }
.s-paused .st { color: var(--wait); }
.s-paused .bar6 i { background: var(--wait); }
.s-error .st { color: var(--bad); }
.s-error .bar6 i { background: var(--bad); }
.s-done .st { color: var(--ok); }
.s-done .bar6 { display: none; }
.dotc { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.row-actions { position: absolute; inset-inline-end: 8px; top: 50%; transform: translateY(-50%); display: none; gap: 4px; background: var(--row-hover); padding-inline-start: 8px; box-shadow: 0 0 0 4px var(--row-hover); border-radius: 8px; }
.item[aria-selected="true"] .row-actions { background: var(--sel); box-shadow: 0 0 0 4px var(--sel); }
.item:hover .row-actions, .item:focus-within .row-actions { display: flex; }
.ra { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.ra:hover { border-color: var(--brand); color: var(--accent-text); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--brand-tint); } 100% { background: transparent; } }

.empty { display: grid; place-items: center; text-align: center; padding: 40px 20px; min-height: 100%; }
.empty .box { max-width: 460px; display: grid; justify-items: center; gap: 10px; }
.empty .ic { width: 64px; height: 64px; border-radius: 18px; background: var(--brand-tint); color: var(--accent-text); display: grid; place-items: center; margin-bottom: 6px; }
.empty h2 { font-size: 19px; }
.empty p { color: var(--muted); }
.empty .row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.empty .tipline { margin-top: 14px; font-size: 12.5px; color: var(--faint); }
.kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11.5px; color: var(--muted); direction: ltr; }

/* ---------- details ---------- */
.details { border-top: 1px solid var(--line); background: var(--surface-2); padding: 12px 16px 14px; display: grid; gap: 10px; max-height: 46vh; overflow: auto; }
.det-head { display: flex; align-items: center; gap: 10px; }
.det-head h2 { font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; text-align: start; }
.det-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; margin: 0; }
.det-grid.two { grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); column-gap: 14px; }
@media (max-width: 900px) { .det-grid.two { grid-template-columns: max-content minmax(0, 1fr); } }
.det-grid dt { color: var(--muted); }
.det-grid dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.det-grid dd .v { overflow: hidden; text-overflow: ellipsis; unicode-bidi: plaintext; }
.det-grid dd.url .v { direction: ltr; }
.segs { height: 14px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
.segs i { position: absolute; top: 0; bottom: 0; background: var(--brand); }
.segs i.part { opacity: .55; }
.det-err { border-radius: 10px; background: var(--bad-tint); padding: 10px 12px; display: grid; gap: 6px; }
.det-err b { color: var(--bad); }
.det-err .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.det-err details { font-size: 12px; color: var(--muted); }
.det-err pre { white-space: pre-wrap; word-break: break-all; direction: ltr; text-align: left; max-height: 160px; overflow: auto; user-select: text; -webkit-user-select: text; }

/* ---------- status bar ---------- */
.statusbar { display: flex; align-items: center; gap: 18px; padding: 5px 14px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--muted); min-height: 30px; }
.statusbar .grow { flex: 1; }
.statusbar b { color: var(--ink); font-weight: 600; }
#sb-folder { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }

/* ---------- dialogs ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, .46); padding: 16px; }
.overlay.open { display: flex; }
.cbar { display: none; }
.dlg { display: none; width: min(560px, 100%); max-height: 100%; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); flex-direction: column; overflow: hidden; }
.dlg.open { display: flex; }
.dlg:focus { outline: none; }
.dlg.wide { width: min(760px, 100%); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 6px; }
.dlg-head h2 { font-size: 17px; flex: 1; }
.dlg-head .count { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.xbtn { width: 34px; height: 34px; border-radius: 9px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); }
.xbtn:hover { background: var(--row-hover); color: var(--ink); }
.dlg-body { padding: 8px 18px 14px; overflow: auto; display: grid; gap: 14px; min-height: 0; align-content: start; }
.dlg-foot { padding: 12px 18px 16px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); background: var(--surface-2); }
.dlg-foot .grow { flex: 1; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lab { font-weight: 600; font-size: 13px; }
.field small, .hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline > input, .inline > select { flex: 1; min-width: 0; }
.err-box { border-radius: 10px; background: var(--bad-tint); padding: 10px 12px; display: grid; gap: 4px; }
.err-box b { color: var(--bad); }
.err-box details { font-size: 12px; color: var(--muted); }
.err-box pre { white-space: pre-wrap; word-break: break-all; direction: ltr; text-align: left; max-height: 140px; overflow: auto; margin: 6px 0 0; user-select: text; -webkit-user-select: text; }
.busy-line { display: flex; gap: 10px; align-items: center; color: var(--muted); }
.spinner { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* the new download window */
.fhead { display: flex; gap: 14px; align-items: center; }
.fhead .ficon { width: 52px; height: 52px; border-radius: 14px; }
.fhead .ficon svg { width: 26px; height: 26px; }
.fhead .meta { min-width: 0; display: grid; gap: 2px; }
.fhead .meta .big { font-size: 20px; font-weight: 700; direction: ltr; text-align: start; unicode-bidi: plaintext; }
.fhead .meta .from { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note { border-radius: 10px; padding: 9px 12px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.note.warn { background: var(--wait-tint); }
.note.info { background: var(--brand-tint); }
.note .acts { margin-inline-start: auto; }
.where { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 8px 7px 12px; }
html[dir="rtl"] .where { padding: 7px 12px 7px 8px; }
.where .wtxt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; unicode-bidi: plaintext; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* the video window (qualities) */
.vcard { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: start; }
.thumb { position: relative; width: 132px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.tall img { object-fit: contain; background: #000; }
.thumb .dur { position: absolute; bottom: 5px; inset-inline-end: 5px; background: rgba(0, 0, 0, .82); color: #fff; font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 5px; border-radius: 6px; direction: ltr; }
.thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
#v-items { display: grid; gap: 6px; }
.vcard .vt { font-weight: 700; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.vcard .vc { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.site-pill { display: inline-block; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 6px; margin-inline-end: 6px; }
.tiles { display: flex; gap: 8px; overflow-x: auto; padding: 3px; }
.tile { position: relative; flex: none; width: 64px; height: 64px; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--line); outline: 3px solid transparent; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .n { position: absolute; top: 4px; inset-inline-start: 4px; background: rgba(0, 0, 0, .78); color: #fff; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 6px; }
.tile[aria-checked="true"] { outline-color: var(--brand); }
.kind { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
.kind button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; border-radius: 9px; padding: 6px 12px; min-height: 36px; font-weight: 700; color: var(--muted); }
.kind button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.kindrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kindrow .hint { font-size: 12px; }
.qlist { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.q { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; column-gap: 12px; row-gap: 1px; padding: 9px 12px; min-height: 52px; cursor: pointer; border-top: 1px solid var(--line); position: relative; }
.q:first-child { border-top: 0; }
.q input { position: absolute; opacity: 0; pointer-events: none; }
.q:hover { background: var(--row-hover); }
.q.sel { background: var(--brand-tint); }
.q.sel::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--brand); }
.q .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--brand-line); display: grid; place-items: center; }
.q.sel .dot { border-color: var(--brand); }
.q.sel .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.q-name { display: flex; align-items: baseline; gap: 8px; line-height: 1.25; }
.q-label { font-weight: 800; font-size: 15.5px; direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.q-tag { font-size: 11.5px; font-weight: 600; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
.q-desc { color: var(--muted); font-size: 12.5px; line-height: 1.45; grid-column: 2 / 4; grid-row: 2; }
.q-size { font-weight: 600; font-size: 13px; white-space: nowrap; }
.badge { display: inline-block; background: var(--brand); color: #000; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 7px 4px; border-radius: 999px; margin-inline-start: 6px; }
.q-note { display: block; font-size: 11.5px; color: var(--muted); }
.alt-list { display: grid; gap: 6px; }
.alt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.alt .k { font-size: 11px; font-weight: 800; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 2px 7px; }
.alt .w { flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* product photos and videos (2.4) */
#c-edit:not([hidden]), #p-ready:not([hidden]) { display: grid; gap: 12px; }
.pcard { display: flex; gap: 10px; align-items: center; }
.pcard .pt { font-weight: 700; font-size: 15px; line-height: 1.45; flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 12px; }
.phead label { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.phead .grow { flex: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.ptile { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); border: 1.5px solid var(--line); padding: 0; cursor: pointer; }
.ptile img, .ptile video { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.ptile video { background: #000; }
:root[data-theme="dark"] .ptile img { background: #2a2a2a; }
.ptile .ck { position: absolute; top: 7px; inset-inline-start: 7px; width: 22px; height: 22px; border-radius: 7px; border: 2px solid #fff; background: rgba(0, 0, 0, .35); box-shadow: 0 1px 3px rgba(0, 0, 0, .4); display: grid; place-items: center; }
.ptile[aria-checked="true"] { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
.ptile[aria-checked="true"] .ck { background: var(--brand); border-color: var(--brand); }
.ptile[aria-checked="true"] .ck::after { content: ""; width: 10px; height: 5px; border: solid #000; border-width: 0 0 2.5px 2.5px; transform: translateY(-1px) rotate(-45deg); }
.ptile[aria-checked="false"] img, .ptile[aria-checked="false"] video { opacity: .55; }
.ptile .vk { position: absolute; bottom: 7px; inset-inline-end: 7px; display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, .8); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; }
.ptile .n { position: absolute; bottom: 7px; inset-inline-start: 7px; background: rgba(0, 0, 0, .7); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; }
.ptile .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); }

/* a part of a video (2.4) */
.cplayer { position: relative; display: grid; place-items: center; background: #000; border-radius: 12px; overflow: hidden; height: clamp(170px, 32vh, 320px); grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.cplayer video, .cplayer .poster { grid-area: 1 / 1; width: 100%; height: 100%; min-height: 0; object-fit: contain; display: block; }
.cplayer .poster { opacity: .85; }
.cplayer .pbig { grid-area: 1 / 1; width: 64px; height: 64px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .55); color: #fff; display: grid; place-items: center; cursor: pointer; transition: opacity .15s; }
.cplayer .pbig:hover { background: rgba(0, 0, 0, .7); }
.cplayer.playing .pbig { opacity: 0; }
.cplayer.playing:hover .pbig { opacity: 1; }
.cplayer .pwait { grid-area: 1 / 1; }
.cplayer .pnote { position: absolute; inset-inline: 12px; bottom: 10px; margin: 0; color: #fff; background: rgba(0, 0, 0, .7); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; text-align: center; }
.tl { position: relative; height: 52px; margin: 2px 12px 0; touch-action: none; cursor: pointer; }
.tl-track { position: absolute; left: 0; right: 0; top: 13px; height: 26px; border-radius: 8px; background: var(--line); }
.tl-sel { position: absolute; top: 0; bottom: 0; background: var(--brand-tint); border-block: 3px solid var(--brand); }
.tl-head { position: absolute; top: -7px; bottom: -7px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; pointer-events: none; }
.tl-h { position: absolute; top: 7px; width: 26px; height: 38px; margin-left: -13px; border: 0; padding: 0; background: transparent; cursor: ew-resize; touch-action: none; }
.tl-h::before { content: ""; position: absolute; left: 7px; right: 7px; top: 0; bottom: 0; border-radius: 6px; background: var(--brand); box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
.tl-h::after { content: ""; position: absolute; left: 12px; width: 2px; top: 12px; bottom: 12px; border-radius: 1px; background: rgba(0, 0, 0, .5); }
.tl-h.drag::before, .tl-h:focus-visible::before { background: var(--brand-press); }
.tl-times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: -4px 12px 0; font-variant-numeric: tabular-nums; }
.tl-times .now { color: var(--ink); font-weight: 700; }
.cut-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
.cut-t { display: grid; gap: 5px; }
.cut-t .lab { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.cut-t .line { display: flex; gap: 6px; align-items: center; }
.cstep { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.cstep button { width: 34px; height: 34px; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 700; color: var(--ink); }
.cstep button:disabled { opacity: .35; }
.cstep output { min-width: 66px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.chip[aria-checked="true"] { border-color: var(--brand); background: var(--brand-tint); color: var(--accent-text); }
.ctitle { font-weight: 700; font-size: 14px; line-height: 1.45; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0; }

/* settings */
.stabs { display: flex; gap: 4px; padding: 4px 18px 0; border-bottom: 1px solid var(--line); }
.stabs button { border: 0; background: none; padding: 9px 12px 11px; font-weight: 700; color: var(--muted); position: relative; }
.stabs button[aria-selected="true"] { color: var(--ink); }
.stabs button[aria-selected="true"]::after { content: ""; position: absolute; inset-inline: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); }
.spane { display: none; gap: 14px; }
.spane.open { display: grid; }
.sw-row { display: flex; align-items: center; gap: 14px; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.sw-row b { display: block; font-weight: 600; }
.sw-row small { display: block; color: var(--muted); font-size: 12.5px; }
.switch { appearance: none; -webkit-appearance: none; flex: none; width: 40px; height: 22px; border-radius: 11px; background: #BDBDBD; position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: inset-inline-start .15s; }
.switch:checked { background: var(--brand); }
.switch:checked::after { inset-inline-start: 21px; }
.nmswitch {
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface-2); font-weight: 700; color: var(--muted); white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
}
.nmswitch:hover { border-color: var(--faint); color: var(--ink); }
.nmswitch .track { width: 34px; height: 20px; border-radius: 10px; background: #BDBDBD; position: relative; flex: none; transition: background .15s; }
.nmswitch .track::after {
  content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: inset-inline-start .15s;
}
.nmswitch[aria-checked="true"] { background: var(--brand-tint); border-color: var(--brand-line); color: var(--accent-text); }
.nmswitch[aria-checked="true"] .track { background: var(--brand); }
.nmswitch[aria-checked="true"] .track::after { inset-inline-start: 17px; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 36px; height: 36px; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 700; }
.stepper output { min-width: 44px; text-align: center; font-weight: 700; }
.saved { color: var(--ok); font-weight: 600; font-size: 13px; }

/* browsers */
.brlist { display: grid; gap: 10px; }
.br { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }
.br-top { display: flex; align-items: center; gap: 10px; }
.br-top b { flex: 1; }
.br-top { flex-wrap: wrap; }
.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; color: var(--muted); }
.steps b { color: var(--ink); }
.pathbox { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.pathbox code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; text-align: left; font-family: Consolas, ui-monospace, monospace; font-size: 12.5px; user-select: text; -webkit-user-select: text; }
.conn { display: flex; gap: 10px; align-items: center; border-radius: 10px; padding: 9px 12px; background: var(--surface-2); font-size: 13px; }
.conn.ok { background: var(--ok-tint); }
.conn .dotc { color: var(--faint); }
.conn.ok .dotc { color: var(--ok); }

/* HELINK's own update */
.upd-btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--brand);
  background: rgba(242, 114, 33, .12); color: #FFB27A; font-weight: 700; font-size: 12.5px; white-space: nowrap; margin-inline-end: 4px;
}
.upd-btn:hover { background: rgba(242, 114, 33, .24); color: #fff; }
.upd-top { display: flex; gap: 14px; align-items: center; }
.upd-ic { width: 52px; height: 52px; border-radius: 14px; background: var(--brand-tint); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.upd-ver { font-size: 19px; font-weight: 800; }
.upd-news { display: grid; gap: 8px; }
.upd-news h3 { font-size: 13.5px; }
.upd-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.upd-track i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s; }
.upd-prog { display: grid; gap: 6px; }
.upd-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.upd-row .grow { flex: 1; min-width: 160px; }
.upd-row .hint b { color: var(--ink); }
.acard h3 .grow { flex: 1; }
.acard h3 .hint { font-weight: 600; }

/* a course or playlist: all of it at once */
#v-list { display: grid; gap: 12px; }
#v-choose { display: grid; gap: 12px; }
#v-inlist { align-items: center; }
.lcard { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; }
.lthumb { position: relative; width: 132px; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--line); box-shadow: 5px -5px 0 -1px var(--surface), 5px -5px 0 0 var(--faint); }
html[dir="rtl"] .lthumb { box-shadow: -5px -5px 0 -1px var(--surface), -5px -5px 0 0 var(--faint); }
.lthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lthumb .lcount { position: absolute; inset-block: 0; inset-inline-end: 0; width: 44%; background: rgba(0, 0, 0, .74); color: #fff; display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 800; font-size: 15px; }
.lthumb .lcount svg { width: 18px; height: 18px; }
.lcard .vt { font-weight: 700; font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.lcard .vc { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.lq { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.lq button { display: grid; gap: 2px; align-content: start; text-align: start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 12px; min-width: 0; color: var(--ink); }
.lq button:hover { border-color: var(--faint); }
.lq button[aria-checked="true"] { border-color: var(--brand); background: var(--brand-tint); }
.lq .ql { font-weight: 800; font-size: 15px; text-align: start; }
.lq .qd { font-size: 11.5px; color: var(--muted); }
.lq .badge { margin-inline-start: 0; justify-self: start; }
.lbox { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lhead { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.lhead label { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
.lhead .grow { flex: 1; }
.lentries { max-height: 286px; overflow: auto; }
.le { display: grid; grid-template-columns: 18px 30px 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.le:first-child { border-top: 0; }
.le:hover { background: var(--row-hover); }
.le .n { color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; direction: ltr; }
.le .lt { width: 64px; aspect-ratio: 16 / 9; border-radius: 6px; object-fit: cover; background: var(--line); display: block; }
.le .t { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 13px; font-weight: 600; }
.le .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; }
.le .hv { flex: none; font-size: 11px; font-weight: 700; color: var(--ok); background: var(--ok-tint); border-radius: 999px; padding: 1px 8px; }
.le .d { color: var(--muted); font-size: 12px; direction: ltr; }
.le.off { cursor: default; }
.le.off .t, .le.off .lt { opacity: .45; }
.le.off .d { font-size: 11.5px; direction: inherit; }
.lbox input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); cursor: pointer; }

/* about */
.about-app { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 6px 0; }
.about-logo { width: 190px; height: 40px; color: var(--ink); }
.about-tag { color: var(--muted); }
.acard { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.acard h3 { font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.points li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--muted); }
.points svg { color: var(--ok); margin-top: 3px; }
.owner { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; }
.avatar { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--brand); }
.owner .nm2 { font-weight: 700; font-size: 16px; }
.owner .rl { color: var(--muted); font-size: 13px; }
.phone { font-size: 20px; font-weight: 800; direction: ltr; letter-spacing: .02em; }
.foot-note { text-align: center; color: var(--faint); font-size: 12px; display: grid; gap: 2px; }

/* menu, toast */
.menu { position: fixed; z-index: 60; min-width: 210px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; display: none; }
.menu.open { display: grid; }
.menu button { border: 0; background: none; text-align: start; padding: 8px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-weight: 500; }
.menu button:hover, .menu button:focus-visible { background: var(--row-hover); outline: none; }
.menu button.danger { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
.toast { position: fixed; bottom: 46px; left: 50%; transform: translate(-50%, 20px); z-index: 70; background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: min(560px, calc(100vw - 32px)); box-shadow: var(--shadow-lg); }
:root[data-theme="dark"] .toast { background: #F2F2F2; color: #111; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.drop { position: fixed; inset: 0; z-index: 80; display: none; place-items: center; background: rgba(242, 114, 33, .14); border: 3px dashed var(--brand); pointer-events: none; font-size: 18px; font-weight: 800; color: var(--accent-text); }
.drop.show { display: grid; }

/* ---------- the small window (from the browser) ---------- */
body.compact { grid-template-rows: 1fr; }
body.compact > .bar, body.compact > .banner, body.compact > .app, body.compact > .statusbar { display: none; }
body.compact .overlay { background: var(--bg); padding: 0; justify-content: stretch; }
body.compact .cbar { display: flex; align-items: center; gap: 10px; width: 100%; background: #000; color: #fff; border-bottom: 3px solid var(--brand); padding: 8px 14px; flex: none; }
body.compact .cbar .logo { width: 96px; height: 20px; }
body.compact .cbar .linkbtn { color: #FFB27A; margin-inline-start: auto; }
body.compact .dlg { width: 100%; flex: 1; max-height: none; border-radius: 0; box-shadow: none; }
body.compact .dlg .xbtn { display: none; }
body.compact .dlg-body { flex: 1; align-content: start; }
/* the downloads started from the browser's menu, near the clock */
.mini { display: none; }
body.mini-mode .dlg { display: none !important; }
body.mini-mode .mini { display: block; width: 100%; flex: 0 1 auto; min-height: 0; overflow: auto; background: var(--surface); }
.mrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; column-gap: 11px; row-gap: 3px; align-items: center; padding: 10px 12px 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mrow:last-child { border-bottom: 0; }
.mrow:hover { background: var(--row-hover); }
.mrow:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.mrow .ficon { grid-column: 1; grid-row: 1 / span 2; width: 36px; height: 36px; }
.mrow .t { grid-column: 2; grid-row: 1; min-width: 0; font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; unicode-bidi: plaintext; text-align: start; }
.mrow .st { grid-column: 2; grid-row: 2; min-width: 0; font-size: 12px; font-weight: 600; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.mrow .st .stx { flex: none; }
.mrow .st .more { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-weight: 500; }
.mrow .st .pct { flex: none; margin-inline-start: auto; color: var(--muted); direction: ltr; }
.mrow .acts { grid-column: 3; grid-row: 1 / span 2; display: flex; gap: 4px; }
.mrow .bar6 { grid-column: 2 / -1; grid-row: 3; margin-top: 5px; }
.mrow .lab { flex: none; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }

/* ---------- narrow windows ---------- */
/* the tools' names need a wide window; "remove music" keeps its name down to 1100 px */
@media (max-width: 1439px) {
  .tool .lbl { display: none; }
  .search { width: 170px; }
}
@media (max-width: 1439px) {
  .add-btn.alt .lbl { display: none; }
  .add-btn.alt { padding: 0 10px; }
}
@media (max-width: 899px) {
  #tb-pause-all, #tb-resume-all, .tools .sep { display: none; }
  .search { min-width: 104px; }
}
@media (max-width: 900px) {
  :root { --cols: minmax(160px, 1fr) 84px 150px 76px; }
  .c-speed, .c-date { display: none !important; }
  .list { min-width: 0; }
}
@media (max-width: 640px) {
  .tools, .search { display: none; }
  .logo { width: 92px; }
  #sb-speed { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .search { display: none; }
  :root { --cols: minmax(150px, 1fr) 140px; }
  .c-size, .c-eta { display: none !important; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

// ---- files waiting in the "new download" window
// A "file" event: checking (a link is being asked about), then ready (the "new download"
// window), media (a page with videos: their qualities), started (no window wanted) or error.
// In the small window, the next window opens before the current one closes (else the small
// window would disappear in between).
function onFile(d) {
  if (dropped.has(d.pid)) return;
  if (d.status === 'checking') { if (!S.answered.has(d.pid)) addChecking(d); return; }
  S.answered.add(d.pid);
  const mine = d.pid === addPid;
  if (mine) addPid = '';
  switch (d.status) {
    case 'started':
      if (mine) closeDialog('dlg-add');
      toast(T('toast.added'));
      return;
    case 'error':
      if (mine) addFailed(d.error);
      else if (d.from === 'browser' && d.error) toast(d.error.title || '');
      return;
    case 'media':
      if (mine) { openVideo(d.seq, d.url); closeDialog('dlg-add'); }
      else if (d.from === 'browser') openVideo(d.seq, d.url);
      return;
    case 'ready':
      if (!S.pending.some((p) => p.pid === d.pid)) S.pending.push(d);
      if (!S.dialogs.includes('dlg-file')) showFile();
      else updateFileCount();
      if (mine) closeDialog('dlg-add');
  }
}

function keepInfo(d) {

  if (d.status === 'loading') list.length = 0;
  list.push(d);
  S.infos.delete(d.seq);
  S.infos.set(d.seq, list);
  while (S.infos.size > 4) S.infos.delete(S.infos.keys().next().value);

function onInfo(d) {
  if (C && d.seq === C.seq) { onClipInfo(d); return; }
  const v = S.video;
  if (!v || d.seq !== v.seq) return;
  if (d.siteName) v.siteName = d.siteName;
  if (d.site) v.site = d.site;
  if (d.status === 'loading') { v.status = 'loading'; videoView(); return; }
  if (d.status === 'updating') { v.updating = true; videoView(); return; }
  if (d.status === 'error') { v.status = 'error'; v.error = d.error; v.media = d.media || []; videoView(); return; }
  if (d.status === 'done') {
    v.status = 'done';
    v.info = d;
    v.kind = S.lastKind === 'audio' ? 'audio' : 'video';
    chooseItem(0);
    videoView();
  }
  if (d.status === 'list' && d.list) {
    v.status = 'list';
    v.list = d.list;
    v.lkind = S.lastKind === 'audio' ? 'audio' : 'video';
    v.lsel = {};
    for (const k of ['video', 'audio']) { const of = d.list.options.filter((o) => o.kind === k); const r = of.find((o) => o.recommended) || of[0]; v.lsel[k] = r ? r.key : ''; }

function hasKind(it, k) { return !!it && it.options.some((o) => o.kind === k); }

  }
  r.el.className = 'mrow s-' + t.state;

  const more = [];

    if (t.speedText) more.push(t.speedText);
    const eta = shortEta(t.eta);
    if (eta) more.push(eta);
  }
  if (t.state === 'done' && t.result) more.push(t.result.sizeText); // where it is: the folder button

  kids.push(stx);

  const pct = t.state === 'done' ? 100 : Math.max(0, Math.min(100, t.percent || 0));

  for (const b of $('c-kind').children) { b.hidden = !hasKind(it, b.dataset.kind); b.setAttribute('aria-checked', String(b.dataset.kind === C.kind)); }
}
for (const b of $('c-kind').children) b.addEventListener('click', () => { if (C && C.kind !== b.dataset.kind) { C.kind = b.dataset.kind; renderClipKind(); renderClipQ(); clipView(); } });
function clipShare() { return C && C.dur ? Math.max(0, (C.end - C.start) / C.dur) : 0; }
function clipOption() { const it = clipCur(); return it && it.options.find((o) => o.key === C.sel[C.kind]); }
function renderClipQ() {
  const it = clipCur();
  if (!it) return;
  const share = clipShare();
  $('c-q').replaceChildren(...it.options.filter((o) => o.kind === C.kind).map((o) => {
    const size = o.sizeBytes > 0 && share ? '≈ ' + humanSize(o.sizeBytes * share) : '';
    const b = el('button', { class: 'chip', type: 'button', role: 'radio', 'aria-checked': String(o.key === C.sel[C.kind]) },
      el('span', { dir: 'ltr' }, o.label), size ? el('small', null, size) : null);
    b.addEventListener('click', () => { C.sel[C.kind] = o.key; renderClipQ(); clipView(); });
    return b;
  }));
  const folders = S.settings && S.settings.categoryDirs;
  $('c-where').textContent = T('clip.where', { folder: S.saveDirLabel + (folders ? (LANG === 'en' ? ' › ' : ' ← ') + (C.kind === 'audio' ? 'Music' : 'Video') : '') });
  const on = !!S.noMusic;
  $('c-nomusic').setAttribute('aria-checked', String(on));
}
$('c-nomusic').addEventListener('click', () => { S.noMusic = !S.noMusic; if (C) renderClipQ(); });
async function downloadClip() {
  const o = clipOption();
  if (!C || !o || !(C.dur > 0)) return;
  stopPreview();
  const go = $('clip-go');
  go.disabled = true;
  S.lastKind = C.kind;
  let r = {};
  try { r = (await api.clipDownload(C.item, o.key, C.start, C.end, !!S.noMusic)) || {}; } catch (_) {}
  if (!C) return;
  go.disabled = false;
  if (r.error) { toast(r.error.title || ''); return; }
  if (!r.id) return;
  closeClip(true);
  toast(r.existing ? T('toast.exists') : T('clip.added'));
  setTimeout(() => flashRow(r.id), 120);
}
$('clip-btn').addEventListener('click', () => openClip(false));
$('clip-go').addEventListener('click', submitClip);
$('clip-cancel').addEventListener('click', () => closeClip(false));
$('clip-x').addEventListener('click', () => closeClip(false));
$('c-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitClip(); });
$('c-paste').addEventListener('click', async () => {
  let t = '';
  try { t = ((await api.paste()) || '').trim(); } catch (_) {}
  if (!t) { toast(T('add.nothing')); return; }
  $('c-input').value = t;
  if (C && C.status !== 'loading') { C.status = 'ask'; submitClip(); }
});
$('video-clip').addEventListener('click', () => openClip(true));

// ------------------------------------------------------------ a product's photos and videos (2.4)
// From a pasted link (HELINK reads the page) or from the browser (the extension sends the
// page open there). All are chosen at first; a click on one leaves it out.
let P = null;
function openProduct(id, from) {
  if (!P || P.id !== id) P = { id: id || 0, status: id ? 'loading' : 'ask', items: [], picked: new Set(), title: '', siteName: '', site: '' };
  $('p-input').value = $('p-input').value && !id ? $('p-input').value : '';
  productView();
  if (!S.dialogs.includes('dlg-product')) openDialog('dlg-product');
  for (const ev of S.products.get(id) || []) onProduct(ev);
}
function productView() {
  if (!P) return;
  const st = P.status;
  $('p-ask').hidden = !(st === 'ask' || st === 'error');
  $('p-loading').hidden = st !== 'loading';
  $('p-error').hidden = st !== 'error';
  $('p-ready').hidden = st !== 'ready';
  $('p-input').readOnly = st === 'loading';
  const go = $('prod-go');
  go.hidden = st === 'loading';
  if (st === 'ready') {
    go.textContent = T('prod.go', { n: P.picked.size });
    go.disabled = P.picked.size === 0;
  } else { go.textContent = T('prod.read'); go.disabled = false; }
  if (st === 'loading') $('p-loading-txt').textContent = T('prod.loading', { site: P.siteName || (LANG === 'en' ? 'the site' : 'الموقع') });
  if (st === 'error') {
    const acts = [];
    const box = errorBox(P.error || {}, acts, 'err-box');
    box.id = 'p-err';
    $('p-err').replaceWith(box);
  }
}
const PROD_SITES = { amazon: ['أمازون', 'Amazon'], alibaba: ['علي بابا', 'Alibaba'], aliexpress: ['علي إكسبريس', 'AliExpress'], noon: ['نون', 'Noon'], temu: ['تيمو', 'Temu'] };
function onProduct(d) {
  if (!d) return;
  // A product sent from the browser while nothing else is shown: its window opens.
  if (!P || P.id !== d.id) {
    if (d.status === 'loading') return;
    if (P && P.status === 'loading' && P.id && P.id !== d.id) return;
    P = { id: d.id, status: 'loading', items: [], picked: new Set(), title: '', siteName: '', site: '' };
    if (!S.dialogs.includes('dlg-product')) openDialog('dlg-product');
  }
  if (d.site) { P.site = d.site; P.siteName = (PROD_SITES[d.site] || [])[LANG === 'en' ? 1 : 0] || ''; }
  if (d.siteName) P.siteName = d.siteName;
  if (d.status === 'loading') { P.status = 'loading'; productView(); return; }
  if (d.status === 'error') { P.status = 'error'; P.error = d.error; productView(); return; }
  if (d.status === 'ready') {
    P.status = 'ready';
    P.items = d.items || [];
    P.title = d.title || '';
    P.picked = new Set(P.items.map((x) => x.i));
    renderProduct();
    productView();
  }
}
function prodThumb(it) {
  const u = it.url;
  // A small copy for the grid where the site makes one (the download is the full one).
  if (/media-amazon\.com\/images\/I\//.test(u)) return u.replace(/\.(jpg|jpeg|png|webp|gif)$/i, '._AC_SX300_.$1');
  if (/alicdn\.com\/.*\/kf\//.test(u) || /aliexpress-media\.com\/kf\//.test(u)) return u + '_300x300.jpg';
  if (/nooncdn\.com\/p\//.test(u)) return u.replace(/width=original/, 'width=300');
  if (/kwcdn\.com\//.test(u)) return u + '?imageView2/2/w/300/q/70/format/webp';
  return u;
}
function renderProduct() {
  $('p-site').textContent = P.siteName || '';
  $('p-site').hidden = !P.siteName;
  $('p-name').textContent = P.title || T('prod.untitled');
  $('p-name').title = P.title || '';
  let nImg = 0;
  $('p-grid').replaceChildren(...P.items.map((it) => {
    const b = el('button', { class: 'ptile', type: 'button', role: 'checkbox', 'aria-checked': String(P.picked.has(it.i)), title: it.url });
    if (it.kind === 'video') {
      if (it.stream) b.append(el('span', { class: 'noimg' }, svg('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 9.3v5.4l4.3-2.7z" fill="currentColor"/>', 34)));
      else b.append(el('video', { src: it.url + '#t=0.5', preload: 'metadata', muted: '', playsinline: '' }));
      b.append(el('span', { class: 'vk' }, svg('<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>', 11), T(it.stream ? 'prod.stream' : 'prod.video')));
    } else {
      nImg++;
      const img = el('img', { src: prodThumb(it), alt: '', referrerpolicy: 'no-referrer', loading: 'lazy' });
      img.addEventListener('error', () => { if (img.src !== it.url) img.src = it.url; else img.replaceWith(el('span', { class: 'noimg' }, '?')); }, { once: false });
      b.append(img, el('span', { class: 'n' }, String(nImg)));
    }
    b.append(el('span', { class: 'ck', 'aria-hidden': 'true' }));
    b.addEventListener('click', () => {
      if (P.picked.has(it.i)) P.picked.delete(it.i); else P.picked.add(it.i);
      b.setAttribute('aria-checked', String(P.picked.has(it.i)));
      productCounts();
    });
    return b;
  }));
  const folders = S.settings && S.settings.categoryDirs;
  const sep = LANG === 'en' ? ' › ' : ' ← ';
  $('p-where').textContent = T('prod.where', { folder: S.saveDirLabel + (folders ? sep + 'Pictures' : '') + sep + (P.title || T('prod.untitled')) });
  productCounts();
}
function productCounts() {
  $('p-count').textContent = T('prod.count', { n: P.picked.size, total: P.items.length });
  $('p-all').checked = P.picked.size === P.items.length && P.items.length > 0;
  $('p-all').indeterminate = P.picked.size > 0 && P.picked.size < P.items.length;
  productView();
}
$('p-all').addEventListener('change', () => {
  if (!P) return;
  P.picked = $('p-all').checked ? new Set(P.items.map((x) => x.i)) : new Set();
  for (const b of $('p-grid').children) b.setAttribute('aria-checked', String($('p-all').checked));
  productCounts();
});
async function submitProduct() {
  if (!P) return;
  if (P.status === 'ready') { downloadProduct(); return; }
  const text = $('p-input').value.trim();
  if (!text || P.status === 'loading') return;
  P.status = 'loading';
  P.siteName = '';
  productView();
  let r = {};
  try { r = (await api.addLink(text)) || {}; } catch (_) {}
  if (!P) return;
  if (r.kind === 'product') {
    P.id = r.id;
    for (const ev of S.products.get(r.id) || []) onProduct(ev);
    return;
  }
  if (r.kind === 'media') { closeProduct(); openVideo(r.seq, text); return; }
  if (r.kind === 'file') { closeProduct(); return; } // the "new download" window takes it
  P.status = 'error';
  P.error = r.error || { title: T('prod.none') };
  productView();
}
async function downloadProduct() {
  if (!P || !P.picked.size) { toast(T('prod.none')); return; }
  const go = $('prod-go');
  go.disabled = true;
  let r = {};
  try { r = (await api.productDownload(P.id, [...P.picked])) || {}; } catch (_) {}
  go.disabled = false;
  if (r.error) { toast(r.error.title || ''); return; }
  const folder = r.folder;
  closeProduct();
  toast(T('prod.added', { n: filesText(r.added || 0) }));
  if (folder) S.lastProductFolder = folder;
}
function closeProduct() {
  P = null;
  closeDialog('dlg-product');
}
$('prod-btn').addEventListener('click', () => { P = null; $('p-input').value = ''; openProduct(0); });
$('prod-go').addEventListener('click', submitProduct);
$('prod-cancel').addEventListener('click', closeProduct);
$('prod-x').addEventListener('click', closeProduct);
$('p-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitProduct(); });
$('p-paste').addEventListener('click', async () => {
  let t = '';
  try { t = ((await api.paste()) || '').trim(); } catch (_) {}
  if (!t) { toast(T('add.nothing')); return; }
  $('p-input').value = t;
  if (P && P.status !== 'loading') { P.status = 'ask'; submitProduct(); }
});

// ------------------------------------------------------------ events
handlers.task = onTask;
handlers.file = onFile;
handlers.info = (d) => { keepInfo(d); onInfo(d); };
// A product's photos (product.go): kept by id, for a window that asks a moment later.
handlers.product = (d) => {
  if (!d) return;
  const list = S.products.get(d.id) || [];
  list.push(d);
  S.products.set(d.id, list);
  while (S.products.size > 6) S.products.delete(S.products.keys().next().value);
  onProduct(d);
};
handlers.thumb = (d) => {
  for (const ev of S.infos.get(d.seq) || []) {
    if (ev.status === 'done' && ev.items && ev.items[d.index]) ev.items[d.index].meta.thumbnail = d.src;
  }
  onThumb(d);
};
handlers.setup = onSetup;
handlers.mode = onMode;
handlers.closeRequest = onCloseRequest;
handlers.browserVideo = (d) => {
  if (S.video && S.video.seq === d.seq) return;
  clearTimeout(slowTimer);
  S.video = null; // a newer reading replaces the one shown
  openVideo(d.seq);
  $('v-oldext').hidden = !d.oldExt;
};
// The small window's own close button: it cancels what it shows.
handlers.dialogClose = () => {
  if (S.miniMode) { hideMini(); return; }
  const id = topDialog();
  if (id === 'dlg-file') cancelFile();
  else if (id === 'dlg-video') cancelVideo();
  else if (id === 'dlg-clip') closeClip();
  else if (id === 'dlg-product') closeProduct();
  else if (id) closeDialog(id);
  else api.dialogDone();
};
handlers.addLink = () => openAdd('');
handlers.folder = (d) => {
  if (d.error) { toast(d.error); return; }
  S.saveDir = d.saveDir;
  S.saveDirLabel = d.saveDirLabel;
  if (d.changed && !d.taskId) toast(T('toast.folder', { folder: d.saveDirLabel }));
  api.settings().then(fillSettings).catch(() => {});
  updateStatus();
};
handlers.dirPicked = (d) => {
  if (d.purpose !== 'file' || !d.ok) { if (d.error) toast(d.error.title || ''); return; }
  S.fileFolder = { folder: d.folder, label: d.label };
  fileFolderText();
};
handlers.settings = (s) => fillSettings(s);
handlers.sepPicked = onSepPicked;
handlers.update = onUpdate;
handlers.showUpdate = () => { if (updOffered()) { S.updPrompt = false; openUpdate(); } };
handlers.sep = (d) => { if (d && d.ready) { S.sepReady = true; if (S.video && S.video.status === 'done') renderNoMusic(); } };

// ------------------------------------------------------------ start
(async function boot() {
  applyStatic();
  let r = {};
  try { r = (await api.init()) || {}; } catch (_) {}
  if (r.lang && r.lang !== LANG) {
    LANG = r.lang === 'en' ? 'en' : 'ar';
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    applyStatic();
  }
  S.version = r.version || '';
  $('about-version').textContent = S.version;
  $('about-version2').textContent = S.version;
  S.saveDir = r.saveDir || '';
  S.saveDirLabel = r.saveDirLabel || '';
  S.lastKind = r.lastKind || 'video';
  S.missing = r.missing || [];
  S.setupSize = r.setupSizeText || '';
  S.sepReady = !!r.sepReady;
  S.sepSize = r.sepSizeText || '';
  setTasks(r.tasks || []);
  if (r.settings) fillSettings(r.settings);
  try { const b = await api.browsers(); S.extSeen = b && b.seenAgo != null ? b.seenAgo : -1; } catch (_) {}
  showExtState();
  renderList();
  // The video tools: prepared in the background the first time (files need nothing).
  if (r.busy === 'setup') { S.setup = { phase: 'download', percent: 0 }; renderBanner(); }
  else if (S.missing.length) startSetup();
  for (const p of r.pending || []) onFile(p);
  // HELINK's own update: where it stands, and whether HELINK was just updated.
  onUpdate(r.update);
  if (r.updated) toast(T('upd.done', { v: r.updated }));
  else if (r.updateFailed) toast(T('upd.failedToast'));
  // The very first time: how to add HELINK to the browser (its most useful step).
  if (S.extSeen < 0 && !S.dialogs.length && S.settings && S.settings.introShown === false) {
    api.setSettings({ introShown: true }).catch(() => {});
    openBrowsers();
  }
  // Now the events that came while the page was opening (a download from the browser).
  try { await api.ready(); } catch (_) {}
})();
})();
</script>
